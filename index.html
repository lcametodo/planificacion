  // ---------------------------------------------------------------
  //  Hoja de tarea
  // ---------------------------------------------------------------
  function openTaskSheet(task, defaults = {}) {
    const isNew = !task;
    const subj = subject();
    const m = isNew ? {
      owner_id: canManage(subj.id) ? subj.id : S.me.id, period: "semanal", month: S.month, week_no: S.week,
      task_type: "visita", status: "pendiente", client: "", title: "", objective: "", due_date: "", checklist: {}, ...defaults,
    } : JSON.parse(JSON.stringify(task));
    const editable = canManage(m.owner_id);
    const owners = S.profiles.filter((p) => p.active && canManage(p.id)).sort((a, b) => (a.id === S.me.id ? -1 : b.id === S.me.id ? 1 : a.full_name.localeCompare(b.full_name)));
    const canDelete = !isNew && editable && (task.created_by === S.me.id || task.owner_id !== S.me.id);
    const by = !isNew && task.created_by && task.created_by !== task.owner_id ? S.by[task.created_by] : null;
    let err = "";
    const ro = editable ? "" : "disabled";

    openSheet({
      title: () => (isNew ? "Nueva tarea" : editable ? "Editar tarea" : "Detalle de tarea"),
      body: () => {
        const weeks = D.weeksOfMonth(m.month);
        return `
        ${by ? `<div class="viewing" style="margin-bottom:14px">${icon("user", "sm")}<span>Asignada por <b>${esc(by.full_name)}</b></span></div>` : ""}
        ${owners.length > 1 && isNew ? `<label class="field"><span>Responsable</span><select class="select" data-bind="owner_id">
          ${owners.map((p) => `<option value="${p.id}" ${m.owner_id === p.id ? "selected" : ""}>${p.id === S.me.id ? "Yo" : esc(p.full_name)} · ${ROLE[p.role]}</option>`).join("")}</select></label>` : ""}
        <div class="field"><span>Periodo</span><div class="seg">
          <button class="${m.period === "semanal" ? "on" : ""}" data-act="set" data-k="period" data-v="semanal" ${ro}>Semanal</button>
          <button class="${m.period === "mensual" ? "on" : ""}" data-act="set" data-k="period" data-v="mensual" ${ro}>Mensual</button></div></div>
        ${m.period === "semanal" ? `<div class="field"><span>Semana de ${D.MES[D.parse(m.month).getMonth()]}</span><div class="chips">${weeks.map((w) => `<button class="chip-btn ${m.week_no === w.no ? "on" : ""}" data-act="set" data-k="week_no" data-v="${w.no}" data-num="1" ${ro}>S${w.no} <span class="muted xs">${D.rangeLabel(w)}</span></button>`).join("")}</div></div>` : ""}
        <div class="field"><span>Tipo</span><div class="chips">${Object.entries(TYPES).map(([k, v]) => `<button class="chip-btn ${m.task_type === k ? "on" : ""}" data-act="set" data-k="task_type" data-v="${k}" ${ro}>${icon(v.i, "sm")}${v.l}</button>`).join("")}</div></div>
        <label class="field"><span>Cliente</span><input class="input" data-bind="client" value="${esc(m.client || "")}" placeholder="Nombre del cliente o cuenta" ${ro}></label>
        <label class="field"><span>Objetivo específico (SMART)</span><textarea class="textarea" data-bind="title" placeholder="Ej. Obtener orden de compra de la fase 1 antes del 30/09" ${ro}>${esc(m.title || "")}</textarea></label>
        <label class="field"><span>Notas</span><textarea class="textarea" style="min-height:60px" data-bind="objective" placeholder="Detalle opcional" ${ro}>${esc(m.objective || "")}</textarea></label>
        <label class="field"><span>Fecha (opcional)</span><input class="input" type="date" data-bind="due_date" value="${esc(m.due_date || "")}" ${ro}></label>
        ${!isNew ? `<div class="field"><span>Estado</span><div class="seg">${Object.entries(STATUS).map(([k, l]) => `<button class="${m.status === k ? "on" : ""} ${k === "en_progreso" ? "olive" : ""}" data-act="set" data-k="status" data-v="${k}" ${ro}>${l}</button>`).join("")}</div></div>` : ""}
        ${m.task_type === "visita" ? `<button class="btn soft block" style="margin-top:16px" data-act="checklist">${icon("clip", "sm")}Checklist de preparación de visita · ${pctTxt(checklistPct(m.checklist))}</button>` : ""}
        ${err ? `<div class="error-msg">${esc(err)}</div>` : ""}`;
      },
      foot: () => editable
        ? `${canDelete ? `<button class="icon-btn" style="width:46px;height:46px;color:var(--brick)" data-act="delete" aria-label="Eliminar">${icon("trash")}</button>` : ""}<button class="btn ghost" data-act="close-sheet">Cancelar</button><button class="btn" data-act="save">${isNew ? "Crear" : "Guardar"}</button>`
        : `<button class="btn ghost" data-act="close-sheet">Cerrar</button>`,
      model: m,
      actions: {
        set: (el) => { m[el.dataset.k] = el.dataset.num ? Number(el.dataset.v) : el.dataset.v; SHEET.refresh(); },
        checklist: () => openChecklistSheet(m, (ck, status) => { m.checklist = ck; if (status) m.status = status; openTaskSheetResume(); }),
        delete: async () => {
          if (!(await confirmBox("¿Eliminar esta tarea?"))) return;
          try { await API.deleteTask(task.id); S.tasks = S.tasks.filter((t) => t.id !== task.id); closeSheet(); render(); toast("Tarea eliminada"); } catch (e) { toast(e.message, true); }
        },
        save: async (el) => {
          err = "";
          if (!(m.title || "").trim() && !(m.client || "").trim()) { err = "Escribe al menos el cliente o el objetivo"; return SHEET.refresh(); }
          if (!(m.title || "").trim()) m.title = `${TYPES[m.task_type].l} a ${m.client}`;
          if (m.period === "semanal" && !m.week_no) m.week_no = S.week;
          el.disabled = true;
          try {
            const row = await API.saveTask({ ...m, due_date: m.due_date || null });
            const i = S.tasks.findIndex((t) => t.id === row.id);
            if (i >= 0) S.tasks[i] = row; else S.tasks.push(row);
            if (row.month === S.month && row.period === "semanal" && isNew) S.week = row.week_no;
            closeSheet(); render(); toast(isNew ? "Tarea creada" : "Tarea guardada");
          } catch (e) { err = e.message; el.disabled = false; SHEET.refresh(); }
        },
      },
    });
    // permite volver a esta hoja tras el checklist sin perder cambios
    const snapshot = SHEET;
    function openTaskSheetResume() {
      closeSheet(true);
      const bd = snapshot.bd, sh = snapshot.el;
      document.body.append(bd, sh);
      SHEET = snapshot; SHEET.refresh();
      bd.classList.add("show"); sh.classList.add("show");
      document.body.style.overflow = "hidden";
    }
  }

  // ---------------------------------------------------------------
  //  Hoja: Checklist de visita (Plantilla 3)
  // ---------------------------------------------------------------
  function openChecklistSheet(task, onDone) {
    const ck = JSON.parse(JSON.stringify(task.checklist || {}));
    ["research", "materials", "post"].forEach((k) => (ck[k] = ck[k] || {}));
    ck.smart = ck.smart || {};
    ck.pain_points = ck.pain_points || ["", "", ""];
    const editable = canManage(task.owner_id);
    const ro = editable ? "" : "disabled";
    const secPct = (k) => CK[k].items.filter(([i]) => ck[k][i]).length / CK[k].items.length;
    const smartDone = () => !!(ck.smart_objective || "").trim() && SMART.every(([k]) => ck.smart[k]);
    const smartWarn = () => SMART.some(([k]) => ck.smart[k] === "parcial" || ck.smart[k] === "no");
    const items = (k) => CK[k].items.map(([i, l]) => `<div class="ck-item ${ck[k][i] ? "on" : ""}" data-act="${editable ? "ck" : ""}" data-s="${k}" data-i="${i}" role="checkbox" aria-checked="${!!ck[k][i]}" tabindex="0">
      <span class="box">${icon("check", "sm")}</span><span class="lbl">${l}</span></div>`).join("");
    const segYN = (k) => `<div class="seg sm">${[["si", "Sí"], ["parcial", "Parcial"], ["no", "No"]].map(([v, l]) =>
      `<button class="${ck.smart[k] === v ? "on" : ""} ${v === "no" ? "brick" : v === "parcial" ? "olive" : ""}" data-act="smart" data-k="${k}" data-v="${v}" ${ro}>${l}</button>`).join("")}</div>`;

    openSheet({
      wide: true,
      title: () => `Preparación de visita`,
      body: () => {
        const p = checklistPct(ck);
        const steps = [["ck-research", "Investigación", secPct("research") === 1], ["ck-materials", "Materiales", secPct("materials") === 1], ["ck-smart", "Objetivo SMART", smartDone()], ["ck-during", "Durante", !!ck.signals], ["ck-post", "Post-visita", secPct("post") === 1]];
        return `<div class="row between"><div class="grow"><div class="bold">${esc(task.client || "Cliente")}</div><div class="small muted ellipsis">${esc(task.title || "")}</div></div>${ring(p, 54, 6, p >= 1 ? "var(--green)" : "var(--olive)")}</div>
        <div class="ck-steps" style="margin-top:12px">${steps.map(([id, l, d]) => `<a href="#" data-act="scroll" data-to="${id}" class="${d ? "done" : ""}"><span class="dot"></span>${l}</a>`).join("")}</div>

        <div class="ck-section" id="ck-research"><h4>${icon("search", "sm")}${CK.research.t}</h4><div class="hint">${CK.research.hint}</div>${items("research")}
          <div class="grid g2" style="margin-top:10px"><label class="field"><span>Fecha última visita</span><input class="input" type="date" data-ck="last_visit_date" value="${esc(ck.last_visit_date || "")}" ${ro}></label>
          <label class="field" style="margin-top:0"><span>Resultado última visita</span><input class="input" data-ck="last_visit_result" value="${esc(ck.last_visit_result || "")}" ${ro}></label></div>
          <div class="field"><span>Pain points identificados</span>${[0, 1, 2].map((i) => `<input class="input" style="margin-top:${i ? 8 : 0}px" data-ck-pp="${i}" placeholder="${i + 1}." value="${esc(ck.pain_points[i] || "")}" ${ro}>`).join("")}</div></div>

        <div class="ck-section" id="ck-materials"><h4>${icon("clip", "sm")}${CK.materials.t}</h4><div class="hint">${CK.materials.hint}</div>${items("materials")}</div>

        <div class="ck-section" id="ck-smart"><h4>${icon("target", "sm")}Definición del objetivo (SMART)</h4><div class="hint">Un objetivo único y específico para la visita</div>
          <label class="field"><span>Objetivo específico de la visita</span><textarea class="textarea" data-ck="smart_objective" ${ro}>${esc(ck.smart_objective || "")}</textarea></label>
          <div style="margin-top:8px">${SMART.map(([k, l]) => `<div class="smart-row"><span class="small bold">${l}</span>${segYN(k)}</div>`).join("")}</div>
          ${smartWarn() ? `<div class="chip olive" style="margin-top:8px;white-space:normal">${icon("alert", "sm")}Si algún criterio es Parcial o No, ajusta la preparación.</div>` : ""}</div>

        <div class="ck-section" id="ck-during"><h4>${icon("users", "sm")}Durante la visita (memoria)</h4>
          <label class="field"><span>Personas presentes</span><input class="input" data-ck="attendees" value="${esc(ck.attendees || "")}" ${ro}></label>
          <label class="field"><span>Temas clave abordados</span><textarea class="textarea" style="min-height:60px" data-ck="topics" ${ro}>${esc(ck.topics || "")}</textarea></label>
          <label class="field"><span>Objeciones encontradas</span><textarea class="textarea" style="min-height:60px" data-ck="objections" ${ro}>${esc(ck.objections || "")}</textarea></label>
          <div class="field"><span>Señales de compra</span><div class="seg">${[["altas", "Altas"], ["medias", "Medias"], ["bajas", "Bajas"]].map(([v, l]) => `<button class="${ck.signals === v ? "on" : ""}" data-act="signals" data-v="${v}" ${ro}>${l}</button>`).join("")}</div></div></div>

        <div class="ck-section" id="ck-post"><h4>${icon("check", "sm")}${CK.post.t}</h4><div class="hint">${CK.post.hint}</div>${items("post")}</div>`;
      },
      foot: () => editable
        ? `<button class="btn ghost" data-act="back">Volver</button>${secPct("post") === 1 && task.status !== "completada" ? `<button class="btn" data-act="finish">${icon("check", "sm")}Guardar y completar</button>` : `<button class="btn" data-act="apply">Listo</button>`}`
        : `<button class="btn" data-act="back">Volver</button>`,
      mounted: (sh) => {
        sh.querySelectorAll("[data-ck]").forEach((el) => el.addEventListener("input", () => (ck[el.dataset.ck] = el.value)));
        sh.querySelectorAll("[data-ck-pp]").forEach((el) => el.addEventListener("input", () => (ck.pain_points[+el.dataset.ckPp] = el.value)));
      },
      actions: {
        ck: (el) => { ck[el.dataset.s][el.dataset.i] = !ck[el.dataset.s][el.dataset.i]; SHEET.refresh(); },
        smart: (el) => { ck.smart[el.dataset.k] = el.dataset.v; SHEET.refresh(); },
        signals: (el) => { ck.signals = el.dataset.v; SHEET.refresh(); },
        scroll: (el) => { const t = SHEET.el.querySelector("#" + el.dataset.to); t && t.scrollIntoView({ behavior: "smooth", block: "start" }); },
        back: () => onDone(task.checklist || {}, null),
        apply: () => onDone(ck, task.status === "pendiente" && checklistPct(ck) > 0 ? "en_progreso" : null),
        finish: () => onDone(ck, "completada"),
      },
    });
  }

  // ---------------------------------------------------------------
  //  Hoja de riesgo
  // ---------------------------------------------------------------
  function openRiskSheet(risk) {
    const subj = subject(), isNew = !risk;
    const editable = canManage(subj.id);
    const m = isNew ? { description: "", impact: "medio", mitigation: "", due_date: "", resolved: false } : { ...risk };
    let err = "";
    const ro = editable ? "" : "disabled";
    openSheet({
      title: () => (isNew ? "Nuevo riesgo" : "Riesgo"),
      body: () => `
        <label class="field"><span>Riesgo / problema</span><textarea class="textarea" data-bind="description" placeholder="Ej. Competencia agresiva en precio" ${ro}>${esc(m.description)}</textarea></label>
        <div class="field"><span>Impacto</span><div class="seg">${Object.entries(IMPACT).map(([k, v]) => `<button class="${m.impact === k ? "on" : ""} ${k === "alto" ? "brick" : k === "medio" ? "olive" : ""}" data-act="set" data-k="impact" data-v="${k}" ${ro}>${v.l}</button>`).join("")}</div></div>
        <label class="field"><span>Acción mitigante</span><textarea class="textarea" style="min-height:60px" data-bind="mitigation" ${ro}>${esc(m.mitigation || "")}</textarea></label>
        <label class="field"><span>Plazo</span><input class="input" type="date" data-bind="due_date" value="${esc(m.due_date || "")}" ${ro}></label>
        ${!isNew ? `<label class="switch"><span class="bold small">Resuelto</span><input type="checkbox" data-bind="resolved" ${m.resolved ? "checked" : ""} ${ro}></label>` : ""}
        ${err ? `<div class="error-msg">${esc(err)}</div>` : ""}`,
      foot: () => editable ? `${!isNew ? `<button class="icon-btn" style="width:46px;height:46px;color:var(--brick)" data-act="delete" aria-label="Eliminar">${icon("trash")}</button>` : ""}<button class="btn ghost" data-act="close-sheet">Cancelar</button><button class="btn" data-act="save">Guardar</button>` : `<button class="btn ghost" data-act="close-sheet">Cerrar</button>`,
      model: m,
      actions: {
        set: (el) => { m[el.dataset.k] = el.dataset.v; SHEET.refresh(); },
        delete: async () => {
          if (!(await confirmBox("¿Eliminar este riesgo?"))) return;
          try { await API.deleteRisk(risk.id); const p = planOf(subj.id); p.plan_risks = p.plan_risks.filter((r) => r.id !== risk.id); closeSheet(); render(); } catch (e) { toast(e.message, true); }
        },
        save: async (el) => {
          if (!m.description.trim()) { err = "Describe el riesgo"; return SHEET.refresh(); }
          el.disabled = true;
          try {
            const plan = await ensurePlanFor(subj.id);
            const row = await API.saveRisk({ ...m, plan_id: plan.id });
            plan.plan_risks = plan.plan_risks || [];
            const i = plan.plan_risks.findIndex((r) => r.id === row.id);
            if (i >= 0) plan.plan_risks[i] = row; else plan.plan_risks.push(row);
            closeSheet(); render(); toast("Riesgo guardado");
          } catch (e) { err = e.message; el.disabled = false; SHEET.refresh(); }
        },
      },
    });
  }

      <form id="login-form" style="margin-top:20px">
        <label class="field"><span>Correo</span><input class="input" type="email" name="email" autocomplete="username" required placeholder="nombre@legrand.com"></label>
        <label class="field"><span>Contraseña</span><input class="input" type="password" name="password" autocomplete="current-password" ${demo ? "" : "required"} placeholder="${demo ? "(no se requiere en demo)" : "••••••••"}"></label>
        <div class="error-msg ${msg ? "" : "hidden"}" id="login-err">${esc(msg)}</div>
        <button class="btn block" style="margin-top:18px">Ingresar</button>
      </form>
      <div class="xs muted" style="margin-top:14px;text-align:center">¿Olvidaste tu contraseña? Pide al administrador que la restablezca.</div>
      ${demo ? `<div class="demo-note">Modo demo: datos de ejemplo guardados solo en este navegador. Elige un usuario para probar cada rol.</div>
        <div class="demo-users">${users.map((u) => `<button class="demo-user" data-act="demo-login" data-email="${esc(u.email)}">${avatar(u)}<div class="grow"><div class="bold small">${esc(u.full_name)}</div><div class="xs muted">${ROLE[u.role]}${u.is_admin ? " · Admin" : ""}${u.territory ? " · " + esc(u.territory) : ""}</div></div>${icon("chevR", "sm")}</button>`).join("")}</div>` : ""}
    </div></div>`;
  }

  function renderForcePassword() {
    app().innerHTML = `<div class="login-wrap"><div class="login-card">
      <div class="brand"><div class="brand-mark">${icon("key")}</div><div>Crea tu contraseña</div></div>
      <h1>Hola, ${esc(firstName(S.me.full_name))}</h1><div class="muted small">Estás usando una contraseña temporal. Crea una nueva para continuar.</div>
      <form id="pwd-form" style="margin-top:20px">
        <label class="field"><span>Nueva contraseña</span><input class="input" type="password" name="p1" minlength="8" autocomplete="new-password" required></label>
        <label class="field"><span>Confirmar contraseña</span><input class="input" type="password" name="p2" minlength="8" autocomplete="new-password" required></label>
        <div class="error-msg hidden" id="pwd-err"></div>
        <button class="btn block" style="margin-top:18px">Guardar y entrar</button>
      </form>
      <button class="btn ghost block" style="margin-top:10px" data-act="logout">Salir</button>
    </div></div>`;
  }

  async function afterLogin() {
    S.me = await API.getMe();
    if (!S.me) throw new Error("Tu usuario no tiene perfil. Contacta al administrador.");
    if (!S.me.active) { await API.signOut(); throw new Error("Tu usuario está desactivado."); }
    if (!location.hash) location.hash = "#/home";
    parseHash();
    await reloadAll();
    render();
  }

  // ---------------------------------------------------------------
  //  Eventos (delegación)
  // ---------------------------------------------------------------
  const ACT = {
    month: (el) => setMonth(Number(el.dataset.d)),
    week: (el) => { S.week = Number(el.dataset.no); render(); },
    goto: (el) => go(el.dataset.to),
    "open-person": (el) => go("#/home/" + el.dataset.id),
    "new-task": (el) => openTaskSheet(null, {
      ...(el.dataset.period ? { period: el.dataset.period } : {}),
      ...(el.dataset.week ? { week_no: Number(el.dataset.week) } : {}),
    }),
    "edit-task": (el) => { const t = S.tasks.find((x) => x.id === el.dataset.id); t && openTaskSheet(t); },
    toggle: async (el) => {
      const t = S.tasks.find((x) => x.id === el.dataset.id); if (!t) return;
      const prev = t.status;
      t.status = t.status === "completada" ? "pendiente" : "completada";
      render();
      try {
        const row = await API.saveTask({ id: t.id, owner_id: t.owner_id, status: t.status });
        Object.assign(t, row);
        if (t.status === "completada") toast("¡Bien hecho! Tarea completada");
      } catch (e) { t.status = prev; render(); toast(e.message, true); }
    },
    "new-risk": () => openRiskSheet(null),
    "edit-risk": (el) => { const r = (planOf(subject().id)?.plan_risks || []).find((x) => x.id === el.dataset.id); r && openRiskSheet(r); },
    "team-mode": (el) => { S.teamMode = el.dataset.m; render(); },
    "admin-tab": (el) => { S.adminTab = el.dataset.t; render(); },
    "admin-filter": (el) => { S.adminFilter = el.dataset.f; render(); },
    "new-user": () => openUserSheet(null),
    "edit-user": (el) => { const p = S.by[el.dataset.id]; p && openUserSheet(p); },
    logout: async () => { await API.signOut(); S.me = null; S.profiles = []; S.tasks = []; S.plans = []; location.hash = ""; renderLogin(); },
    "reset-demo": async () => { if (!(await confirmBox("¿Reiniciar todos los datos de demostración?", "Reiniciar"))) return; API.resetDemo(); S.me = null; location.hash = ""; renderLogin(); },
    "demo-login": async (el) => { try { await API.signIn(el.dataset.email, ""); await afterLogin(); } catch (e) { renderLogin(e.message); } },
    "close-sheet": () => closeSheet(),
  };

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const act = el.dataset.act;
    if (!act) return;
    if (el.tagName === "A") e.preventDefault();
    if (SHEET && SHEET.el.contains(el) && SHEET.actions && SHEET.actions[act]) return SHEET.actions[act](el, e);
    if (ACT[act]) ACT[act](el, e);
  });

  // Enlace de campos del formulario en hojas
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (SHEET && SHEET.model && SHEET.el.contains(el) && el.dataset.bind) {
      SHEET.model[el.dataset.bind] = el.type === "checkbox" ? el.checked : el.value;
    }
    if (el.id === "admin-q") {
      S.adminQ = el.value; const pos = el.selectionStart; render();
      const n = $("#admin-q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
    }
  });
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (SHEET && SHEET.model && SHEET.el.contains(el) && el.dataset.bind) {
      SHEET.model[el.dataset.bind] = el.type === "checkbox" ? el.checked : el.value;
      if (el.tagName === "SELECT") SHEET.refresh();
      return;
    }
    if ((el.dataset.planField || el.dataset.weekField) && !el.readOnly) onPlanField(el);
  });
  document.addEventListener("toggle", (e) => {
    const d = e.target; if (d.dataset && d.dataset.weekAcc) S.openWeeks[d.dataset.weekAcc] = d.open;
  }, true);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && SHEET) closeSheet();
    if ((e.key === "Enter" || e.key === " ") && e.target.matches(".ck-item")) { e.preventDefault(); e.target.click(); }
  });

  document.addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.id === "login-form") {
      const btn = f.querySelector("button"); btn.disabled = true;
      try { await API.signIn(f.email.value, f.password.value); await afterLogin(); }
      catch (err) { renderLogin(err.message); }
    }
    if (f.id === "pwd-form") {
      const errEl = $("#pwd-err");
      const show = (m) => { errEl.textContent = m; errEl.classList.remove("hidden"); };
      if (f.p1.value.length < 8) return show("Usa al menos 8 caracteres");
      if (f.p1.value !== f.p2.value) return show("Las contraseñas no coinciden");
      const btn = f.querySelector("button"); btn.disabled = true;
      try {
        await API.changePassword(f.p1.value);
        S.me.must_change_password = false; if (S.by[S.me.id]) S.by[S.me.id].must_change_password = false;
        f.reset(); toast("Contraseña actualizada");
        if (!S.profiles.length) await reloadAll();
        render();
      } catch (err) { show(err.message); btn.disabled = false; }
    }
  });

  // Tooltip para gráficos y columnas semanales (hover en escritorio)
  const tip = document.createElement("div"); tip.className = "chart-tip"; document.body.appendChild(tip);
  document.addEventListener("mousemove", (e) => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (!t) { tip.style.opacity = 0; return; }
    tip.textContent = t.getAttribute("data-tip");
    tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = e.clientY - 34 + "px"; tip.style.opacity = 1;
  });

  // ---------------------------------------------------------------
  //  Arranque
  // ---------------------------------------------------------------
  (async function start() {
    app().innerHTML = `<div class="spinner"></div>`;
    API.onSignedOut(() => { S.me = null; renderLogin(); });
    try {
      const uid = await API.init();
      if (!uid) return renderLogin();
      await afterLogin();
    } catch (e) { renderLogin(e.message); }
  })();
})();

  </script>
</body>
</html>
