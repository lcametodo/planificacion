  <style>
/* ==========================================================
   Ruta Comercial · estilos (mobile first)
   Paleta corporativa Legrand (Management Summary)
   ========================================================== */
:root {
  --green: #14564A;
  --green-600: #1B6B5D;
  --green-50: #E6F0ED;
  --green-100: #CFE3DD;
  --slate: #45616C;
  --slate-50: #EBF0F2;
  --brick: #B33A2B;
  --brick-50: #F7E7E4;
  --olive: #8A7B1F;
  --olive-50: #F3F0DE;

  --bg: #F3F5F4;
  --surface: #FFFFFF;
  --surface-2: #F8FAF9;
  --line: #E1E7E5;
  --ink: #16211F;
  --ink-2: #4A5A57;
  --ink-3: #7C8B88;
  --shadow: 0 1px 2px rgba(20, 40, 36, .06), 0 4px 16px rgba(20, 40, 36, .06);
  --shadow-lg: 0 10px 40px rgba(10, 30, 26, .18);
  --radius: 18px;
  --radius-sm: 12px;
  --nav-h: 68px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --green: #3FA38F; --green-600: #52B29E; --green-50: #16302B; --green-100: #1D3F38;
    --slate: #8FA9B3; --slate-50: #1D2A2F;
    --brick: #E0725F; --brick-50: #3A1F1B;
    --olive: #C9B64A; --olive-50: #2E2A14;
    --bg: #0E1413; --surface: #161E1C; --surface-2: #1B2422; --line: #27332F;
    --ink: #E9EFED; --ink-2: #B3C1BD; --ink-3: #82928E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --green: #3FA38F; --green-600: #52B29E; --green-50: #16302B; --green-100: #1D3F38;
  --slate: #8FA9B3; --slate-50: #1D2A2F;
  --brick: #E0725F; --brick-50: #3A1F1B;
  --olive: #C9B64A; --olive-50: #2E2A14;
  --bg: #0E1413; --surface: #161E1C; --surface-2: #1B2422; --line: #27332F;
  --ink: #E9EFED; --ink-2: #B3C1BD; --ink-3: #82928E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--green); }
.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.bold { font-weight: 700; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stack > * + * { margin-top: 12px; }
.icon { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon.sm { width: 16px; height: 16px; }
.icon.lg { width: 24px; height: 24px; }

/* ---------- Layout ---------- */
#app { min-height: 100vh; }
.shell { display: flex; min-height: 100vh; }
.main { flex: 1; min-width: 0; padding: 0 16px calc(var(--nav-h) + var(--safe-b) + 28px); }
.page { max-width: 1120px; margin: 0 auto; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px 12px; margin: 0 -16px 8px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.topbar h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 20px; margin: 0; letter-spacing: -.01em; line-height: 1.2; }
.topbar .sub { font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.01em; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  background: var(--green); color: #fff; display: grid; place-items: center;
}
.brand-mark svg { width: 20px; height: 20px; }

/* Bottom nav (mobile) */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  display: flex; justify-content: space-around; align-items: stretch;
  background: var(--surface); border-top: 1px solid var(--line);
}
.nav .brand, .nav .nav-foot { display: none; }
.nav a {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3); text-decoration: none; font-size: 11px; font-weight: 600;
}
.nav a .pill { padding: 4px 16px; border-radius: 999px; transition: background .2s; }
.nav a.active { color: var(--green); }
.nav a.active .pill { background: var(--green-50); }

/* Desktop sidebar */
@media (min-width: 900px) {
  .nav {
    position: sticky; top: 0; height: 100vh; width: 240px; flex: none;
    flex-direction: column; justify-content: flex-start; gap: 4px;
    padding: 20px 14px; border-top: 0; border-right: 1px solid var(--line);
  }
  .nav .brand { display: flex; padding: 4px 8px 22px; }
  .nav a { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; font-size: 14px; padding: 0; }
  .nav a .pill { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border-radius: 12px; }
  .nav a:hover .pill { background: var(--surface-2); }
  .nav a.active .pill { background: var(--green-50); }
  .nav a .lbl-inline { display: inline; }
  .nav .nav-foot { display: block; margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); }
  .main { padding: 0 32px 48px; }
  .topbar { margin: 0 -32px 12px; padding: 22px 32px 14px; }
  .topbar h1 { font-size: 24px; }
  .fab { bottom: 32px !important; right: 40px !important; }
}
.nav a .lbl-inline { display: none; }
@media (min-width: 900px) { .nav a .lbl-stack { display: none; } .nav a .pill .lbl-inline { display: inline; } }

/* ---------- Cards ---------- */
.card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px; border: 1px solid var(--line);
}
.card + .card { margin-top: 12px; }
.card h3 { margin: 0 0 10px; font-size: 15px; letter-spacing: -.005em; }
.section-title {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin: 22px 2px 10px; font-size: 13px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--ink-3);
}
.section-title .count { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--ink-2); letter-spacing: 0; }

.grid { display: grid; gap: 12px; }
@media (min-width: 640px) { .grid.g2 { grid-template-columns: 1fr 1fr; } }
@media (min-width: 900px) {
  .grid.g3 { grid-template-columns: repeat(3, 1fr); }
  .grid.g4 { grid-template-columns: repeat(4, 1fr); }
  .cols { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; align-items: start; }
}
.grid.g2m { grid-template-columns: 1fr 1fr; }

/* ---------- Hero ---------- */
.hero {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, #14564A 0%, #1E6E5F 60%, #2B7E6D 100%);
  color: #fff; border-radius: 24px; padding: 18px; box-shadow: var(--shadow);
}
.hero::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px;
  border-radius: 50%; background: rgba(255,255,255,.07);
}
.hero .hero-top { display: flex; gap: 16px; align-items: center; position: relative; z-index: 1; }
.hero .eyebrow { font-size: 12px; font-weight: 600; opacity: .8; text-transform: uppercase; letter-spacing: .08em; }
.hero .big { font-size: 22px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
.hero .meta { font-size: 13px; opacity: .85; }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; position: relative; z-index: 1; }
.hero-stat { background: rgba(255,255,255,.12); border-radius: 14px; padding: 10px 12px; }
.hero-stat .v { font-size: 18px; font-weight: 800; }
.hero-stat .l { font-size: 11px; opacity: .85; }
.hero-stat .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.2); margin-top: 6px; overflow: hidden; }
.hero-stat .bar i { display: block; height: 100%; background: #fff; border-radius: 3px; }

/* ---------- Ring ---------- */
.ring { position: relative; flex: none; display: grid; place-items: center; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .ring-label { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 800; line-height: 1; }
.ring .ring-label small { display: block; font-size: 10px; font-weight: 600; opacity: .75; margin-top: 2px; }

/* ---------- Week strip (vertical columns) ---------- */
.weeks { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin-top: 14px; }
.wk {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 6px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0;
  transition: border-color .15s, transform .15s;
}
.wk:active { transform: scale(.97); }
.wk.sel { border-color: var(--green); background: var(--green-50); }
.wk .wk-n { font-weight: 800; font-size: 14px; }
.wk .wk-d { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.wk .col { width: 14px; height: 46px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.wk .col i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 4px 4px 0 0; background: var(--green); }
.wk .wk-p { font-size: 11px; font-weight: 700; color: var(--ink-2); }
.wk .now { font-size: 9px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: .06em; }

/* ---------- Tasks ---------- */
.task {
  display: flex; gap: 12px; align-items: flex-start; padding: 14px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
}
.task + .task { margin-top: 8px; }
.task.done .t-title { text-decoration: line-through; color: var(--ink-3); }
.check {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; flex: none; color: transparent; transition: all .15s; padding: 0;
}
.check:hover { border-color: var(--green); }
.check.on { background: var(--green); border-color: var(--green); color: #fff; }
.check.half { border-color: var(--olive); background: var(--olive-50); color: var(--olive); }
.check[disabled] { cursor: default; opacity: .6; }
.t-body { flex: 1; min-width: 0; cursor: pointer; }
.t-client { font-size: 12px; font-weight: 700; color: var(--green); display: flex; align-items: center; gap: 5px; }
.t-title { font-weight: 600; margin-top: 1px; }
.t-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line);
  white-space: nowrap;
}
.chip.green { background: var(--green-50); color: var(--green); border-color: transparent; }
.chip.olive { background: var(--olive-50); color: var(--olive); border-color: transparent; }
.chip.brick { background: var(--brick-50); color: var(--brick); border-color: transparent; }
.chip.slate { background: var(--slate-50); color: var(--slate); border-color: transparent; }
.mini-bar { height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; width: 56px; }
.mini-bar i { display: block; height: 100%; background: var(--olive); }
.mini-bar.full i { background: var(--green); }

.empty {
  text-align: center; padding: 28px 16px; color: var(--ink-3); background: var(--surface);
  border: 1.5px dashed var(--line); border-radius: 16px;
}
.empty .e-ico { width: 44px; height: 44px; border-radius: 14px; background: var(--green-50); color: var(--green); display: grid; place-items: center; margin: 0 auto 10px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 700; font-size: 14px;
  background: var(--green); color: #fff; transition: filter .15s, transform .1s; min-height: 44px;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .55; pointer-events: none; }
.btn.ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.btn.soft { background: var(--green-50); color: var(--green); }
.btn.danger { background: var(--brick-50); color: var(--brick); }
.btn.block { width: 100%; }
.btn.sm { padding: 7px 12px; min-height: 36px; font-size: 13px; border-radius: 10px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; color: var(--ink-2); flex: none; padding: 0;
}
.icon-btn:hover { color: var(--green); border-color: var(--green-100); }
.fab {
  position: fixed; right: 18px; bottom: calc(var(--nav-h) + var(--safe-b) + 16px); z-index: 25;
  width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--green); color: #fff;
  display: grid; place-items: center; box-shadow: 0 8px 24px rgba(20, 86, 74, .4);
}
.fab .icon { width: 26px; height: 26px; }

/* Month switcher */
.month-sw { display: inline-flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.month-sw button { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-2); padding: 0; }
.month-sw button:hover { background: var(--surface-2); }
.month-sw span { font-weight: 700; font-size: 13px; padding: 0 6px; min-width: 92px; text-align: center; text-transform: capitalize; }

/* Subject banner */
.viewing {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px;
  background: var(--slate-50); color: var(--slate); font-size: 13px; font-weight: 600; margin-bottom: 12px;
}
.viewing .grow { color: var(--ink); }

/* ---------- Forms ---------- */
.field { display: block; }
.field + .field { margin-top: 14px; }
.field > span { display: block; font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
.input, .select, .textarea {
  width: 100%; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px;
  padding: 11px 12px; font-size: 16px; outline: none; transition: border-color .15s, background .15s; min-height: 46px;
}
.textarea { min-height: 84px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--green); background: var(--surface); }
.input[readonly] { color: var(--ink-3); }
.money { position: relative; }
.money::before { content: "$"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-weight: 600; }
.money .input { padding-left: 24px; }
.seg { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--ink-2); min-height: 38px; }
.seg button.on { background: var(--surface); color: var(--green); box-shadow: var(--shadow); }
.seg.sm button { padding: 5px 4px; font-size: 12px; min-height: 32px; }
.seg button.on.brick { color: var(--brick); }
.seg button.on.olive { color: var(--olive); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px;
  font-size: 13px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; min-height: 38px;
}
.chip-btn.on { border-color: var(--green); background: var(--green-50); color: var(--green); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.switch input { appearance: none; width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; flex: none; margin: 0; cursor: pointer; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch input:checked { background: var(--green); }
.switch input:checked::after { transform: translateX(18px); }
.form-actions { display: flex; gap: 10px; margin-top: 20px; }
.form-actions .btn { flex: 1; }
.error-msg { color: var(--brick); font-size: 13px; font-weight: 600; margin-top: 10px; }

/* ---------- Sheet / modal ---------- */
.backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(8, 20, 18, .45); opacity: 0; transition: opacity .2s; }
.backdrop.show { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-height: 92vh; display: flex; flex-direction: column;
  background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: var(--shadow-lg);
  transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
}
.sheet.show { transform: none; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 10px auto 0; flex: none; }
.sheet .sheet-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px 10px; flex: none; }
.sheet .sheet-head h2 { font-size: 18px; margin: 0; flex: 1; letter-spacing: -.01em; }
.sheet .sheet-body { overflow-y: auto; padding: 4px 18px calc(22px + var(--safe-b)); -webkit-overflow-scrolling: touch; }
.sheet .sheet-foot { flex: none; padding: 12px 18px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); display: flex; gap: 10px; }
.sheet .sheet-foot .btn { flex: 1; }
@media (min-width: 700px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: 560px; max-height: 86vh; border-radius: 24px; transform: translate(-50%, -46%) scale(.97); opacity: 0; transition: transform .22s, opacity .22s; }
  .sheet.show { transform: translate(-50%, -50%); opacity: 1; }
  .sheet.wide { width: 720px; }
  .sheet .grab { display: none; }
}

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 20px); z-index: 80;
  transform: translate(-50%, 20px); opacity: 0; transition: all .25s;
  background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 14px; font-weight: 600; font-size: 14px;

  <script>
/* ---- dates.js ---- */
// Utilidades de fechas: semanas del mes (lunes a domingo, recortadas al mes).
// Si la primera semana solo tiene sábado/domingo, se une a la siguiente.
(function () {
  const pad = (n) => String(n).padStart(2, "0");
  const monthKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-01`;
  const parse = (s) => { const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d || 1); };
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  function weeksOfMonth(mk) {
    const first = parse(mk), y = first.getFullYear(), m = first.getMonth();
    const last = new Date(y, m + 1, 0).getDate();
    const segs = [];
    let d = 1;
    while (d <= last) {
      const dow = (new Date(y, m, d).getDay() + 6) % 7; // 0 = lunes
      const end = Math.min(last, d + (6 - dow));
      segs.push({ s: d, e: end, startDow: dow });
      d = end + 1;
    }
    if (segs.length > 1 && segs[0].startDow >= 5) { segs[1].s = segs[0].s; segs.shift(); }
    return segs.map((g, i) => ({ no: i + 1, start: new Date(y, m, g.s), end: new Date(y, m, g.e) }));
  }

  function weekNoOf(date) {
    const w = weeksOfMonth(monthKey(date));
    const f = w.find((x) => date >= x.start && date <= new Date(x.end.getFullYear(), x.end.getMonth(), x.end.getDate(), 23, 59, 59));
    return f ? f.no : 1;
  }

  // Fracción transcurrida (0..1) de un rango de días hábiles, para el ritmo esperado
  function elapsedFraction(start, end, now = new Date()) {
    const day = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const s = day(start), e = day(end), n = day(now);
    if (n < s) return 0;
    if (n > e) return 1;
    let total = 0, done = 0;
    for (let d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) {
      const wd = d.getDay() !== 0 && d.getDay() !== 6;
      if (!wd) continue;
      total++;
      if (d < n) done++;
      else if (+d === +n) done += 0.5;
    }
    return total ? done / total : 1;
  }

  const MES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const MES_C = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  const monthLabel = (mk) => { const d = parse(mk); return `${MES[d.getMonth()]} ${d.getFullYear()}`; };
  const rangeLabel = (w) => `${w.start.getDate()}–${w.end.getDate()} ${MES_C[w.end.getMonth()]}`;
  const shortDate = (s) => { if (!s) return ""; const d = parse(s); return `${d.getDate()} ${MES_C[d.getMonth()]}`; };
  const addMonths = (mk, n) => { const d = parse(mk); return monthKey(new Date(d.getFullYear(), d.getMonth() + n, 1)); };

  window.RC_DATES = { pad, monthKey, parse, iso, weeksOfMonth, weekNoOf, elapsedFraction, monthLabel, rangeLabel, shortDate, addMonths, MES };
})();

  </script>
  <script>
/* ---- api.js ---- */
// =====================================================================
//  Capa de datos: Supabase (producción) o Demo (localStorage)
//  Ambas exponen exactamente la misma interfaz.
// =====================================================================
(function () {
  const CFG = window.APP_CONFIG || {};
  const RANK = { director_general: 4, director: 3, gerente: 2, vendedor: 1 };

  // -------------------------------------------------------------------
  //  SUPABASE
  // -------------------------------------------------------------------
  function SupabaseApi() {
    const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true },
    });
    let uid = null;
    const ok = ({ data, error }) => { if (error) throw new Error(traducir(error.message)); return data; };

    function traducir(m) {
      if (/Invalid login credentials/i.test(m)) return "Correo o contraseña incorrectos";
      if (/row-level security/i.test(m)) return "No tienes permiso para esta acción";
      if (/banned/i.test(m)) return "Tu usuario está desactivado. Contacta al administrador.";
      if (/should be different/i.test(m)) return "La nueva contraseña debe ser diferente a la anterior";
      return m;
    }

    return {
      mode: "supabase",
      async init() {
        const { data } = await sb.auth.getSession();
        uid = data.session?.user?.id || null;
        return uid;
      },
      onSignedOut(cb) {
        sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") cb(); });
      },
      async signIn(email, password) {
        const d = ok(await sb.auth.signInWithPassword({ email: email.trim().toLowerCase(), password }));
        uid = d.user.id; return uid;
      },
      async signOut() { await sb.auth.signOut(); uid = null; },
      async changePassword(password) {
        ok(await sb.auth.updateUser({ password }));
        ok(await sb.rpc("clear_must_change_password"));
      },
      async getMe() {
        return ok(await sb.from("profiles").select("*").eq("id", uid).single());
      },
      async listProfiles() {
        return ok(await sb.from("profiles").select("*").order("full_name"));
      },
      async listTasks(month) {
        return ok(await sb.from("tasks").select("*").eq("month", month).order("created_at"));
      },
      async saveTask(t) {
        const cols = ["owner_id", "period", "month", "week_no", "task_type", "client", "title", "objective", "due_date", "status", "checklist"];
        const row = {}; cols.forEach((c) => { if (c in t) row[c] = t[c] === "" ? null : t[c]; });
        if (t.id) return ok(await sb.from("tasks").update(row).eq("id", t.id).select().single());
        return ok(await sb.from("tasks").insert(row).select().single());
      },
      async deleteTask(id) {
        const d = ok(await sb.from("tasks").delete().eq("id", id).select());
        if (!d.length) throw new Error("No tienes permiso para eliminar esta tarea");
      },
      async listPlans(month) {
        return ok(await sb.from("monthly_plans").select("*, plan_weeks(*), plan_risks(*)").eq("month", month));
      },
      async ensurePlan(ownerId, month) {
        const found = ok(await sb.from("monthly_plans").select("*, plan_weeks(*), plan_risks(*)")
          .eq("owner_id", ownerId).eq("month", month).maybeSingle());
        if (found) return found;
        const created = ok(await sb.from("monthly_plans").insert({ owner_id: ownerId, month }).select().single());
        return { ...created, plan_weeks: [], plan_risks: [] };
      },
      async updatePlan(id, patch) {
        return ok(await sb.from("monthly_plans").update(patch).eq("id", id).select().single());
      },
      async upsertWeek(planId, weekNo, patch) {
        return ok(await sb.from("plan_weeks").upsert({ plan_id: planId, week_no: weekNo, ...patch }, { onConflict: "plan_id,week_no" }).select().single());
      },
      async saveRisk(r) {
        const row = { plan_id: r.plan_id, description: r.description, impact: r.impact, mitigation: r.mitigation || null, due_date: r.due_date || null, resolved: !!r.resolved };
        if (r.id) return ok(await sb.from("plan_risks").update(row).eq("id", r.id).select().single());
        return ok(await sb.from("plan_risks").insert(row).select().single());
      },
      async deleteRisk(id) { ok(await sb.from("plan_risks").delete().eq("id", id)); },
      async updateProfile(id, patch) {
        return ok(await sb.from("profiles").update(patch).eq("id", id).select().single());
      },
      async admin(action, payload) {
        const { data, error } = await sb.functions.invoke("admin-users", { body: { action, ...payload } });
        if (error) {
          let msg = error.message;
          try { const j = await error.context.json(); if (j?.error) msg = j.error; } catch (_) { /* noop */ }
          throw new Error(msg);
        }
        if (data?.error) throw new Error(data.error);
        return data;
      },
    };
  }

  // -------------------------------------------------------------------
  //  DEMO (localStorage, con las mismas reglas de seguridad)
  // -------------------------------------------------------------------
  function DemoApi() {
    const KEY = "rutacomercial_demo_v1";
    let db = null, uid = null;
    const mem = {};
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (_) { return mem[k] ?? null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (_) { mem[k] = v; } },
      del(k) { try { localStorage.removeItem(k); } catch (_) { delete mem[k]; } },
    };
    const save = () => store.set(KEY, JSON.stringify(db));
    const id = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Math.random().toString(36).slice(2));
    const clone = (o) => JSON.parse(JSON.stringify(o));
    const me = () => db.profiles.find((p) => p.id === uid);
    const P = (i) => db.profiles.find((p) => p.id === i);

    function isUnder(child, boss) {
      let cur = P(child), n = 0;
      while (cur && cur.manager_id && n++ < 12) { if (cur.manager_id === boss) return true; cur = P(cur.manager_id); }
      return false;
    }
    const canSee = (t) => { const m = me(); return !!m && (t === m.id || m.is_admin || m.role === "director_general" || isUnder(t, m.id)); };
    const canManage = (t) => { const m = me(); return !!m && (t === m.id || m.role === "director_general" || isUnder(t, m.id)); };
    const deny = () => { throw new Error("No tienes permiso para esta acción"); };
    const withPlan = (p) => ({ ...clone(p), plan_weeks: clone(db.weeks.filter((w) => w.plan_id === p.id)), plan_risks: clone(db.risks.filter((r) => r.plan_id === p.id)) });

    function load() {
      const raw = store.get(KEY);
      db = raw ? JSON.parse(raw) : seed();
      if (!raw) save();
      uid = store.get(KEY + "_uid");
      if (uid && !P(uid)) uid = null;
    }

    return {
      mode: "demo",
      async init() { load(); return uid; },
      onSignedOut() {},
      demoUsers() { return clone(db.profiles.filter((p) => p.active)); },
      resetDemo() { store.del(KEY); store.del(KEY + "_uid"); load(); },
      async signIn(email) {
        const p = db.profiles.find((x) => x.email === email.trim().toLowerCase());
        if (!p) throw new Error("Usuario no encontrado (modo demo)");
        if (!p.active) throw new Error("Tu usuario está desactivado. Contacta al administrador.");
        uid = p.id; store.set(KEY + "_uid", uid); return uid;
      },
      async signOut() { uid = null; store.del(KEY + "_uid"); },
      async changePassword() { me().must_change_password = false; save(); },
      async getMe() { return clone(me()); },
      async listProfiles() {
        return clone(db.profiles.filter((p) => canSee(p.id) || isUnder(uid, p.id)).sort((a, b) => a.full_name.localeCompare(b.full_name)));
      },
      async listTasks(month) { return clone(db.tasks.filter((t) => t.month === month && canSee(t.owner_id))); },
      async saveTask(t) {
        if (!canManage(t.owner_id)) deny();
        const now = new Date().toISOString();
        if (t.id) {
          const cur = db.tasks.find((x) => x.id === t.id);
          if (!cur || !canManage(cur.owner_id)) deny();
          const wasDone = cur.status === "completada";
          Object.assign(cur, t, { created_by: cur.created_by, updated_at: now });
          if (cur.status === "completada" && !wasDone) cur.completed_at = now;
          if (cur.status !== "completada") cur.completed_at = null;
          if (cur.period === "mensual") cur.week_no = null;
          save(); return clone(cur);
        }
        const row = { checklist: {}, status: "pendiente", task_type: "visita", period: "semanal", ...t, id: id(), created_by: uid, created_at: now, updated_at: now };
        row.completed_at = row.status === "completada" ? now : null;
        if (row.period === "mensual") row.week_no = null;
        db.tasks.push(row); save(); return clone(row);
      },
      async deleteTask(tid) {
        const t = db.tasks.find((x) => x.id === tid);
        if (!t || !canManage(t.owner_id) || !(t.created_by === uid || t.owner_id !== uid)) throw new Error("No tienes permiso para eliminar esta tarea");
        db.tasks = db.tasks.filter((x) => x.id !== tid); save();
      },
      async listPlans(month) { return db.plans.filter((p) => p.month === month && canSee(p.owner_id)).map(withPlan); },
      async ensurePlan(ownerId, month) {
        let p = db.plans.find((x) => x.owner_id === ownerId && x.month === month);
        if (p) { if (!canSee(ownerId)) deny(); return withPlan(p); }
        if (!canManage(ownerId)) deny();
        p = { id: id(), owner_id: ownerId, month, territory: P(ownerId)?.territory || "", goal_amount: 0, notes: "" };
        db.plans.push(p); save(); return withPlan(p);
      },
      async updatePlan(pid, patch) {
        const p = db.plans.find((x) => x.id === pid); if (!p || !canManage(p.owner_id)) deny();
        Object.assign(p, patch); save(); return clone(p);
      },
      async upsertWeek(planId, weekNo, patch) {
        const p = db.plans.find((x) => x.id === planId); if (!p || !canManage(p.owner_id)) deny();

      const ts = tasks.filter((t) => t.period === "semanal" && t.week_no === w.no);
      const done = ts.filter(isDone).length;
      return { w, total: ts.length, done, pct: ts.length ? done / ts.length : null, expected: D.elapsedFraction(w.start, w.end) };
    });
    const done = tasks.filter(isDone).length;
    const visits = tasks.filter((t) => t.task_type === "visita");
    const plans = ownerIds.map(planOf).filter(Boolean);
    const goal = plans.reduce((a, p) => a + (Number(p.goal_amount) || 0), 0);
    let closed = 0, pipeline = 0, npsSum = 0, npsN = 0;
    for (const p of plans) {
      const ws = [...(p.plan_weeks || [])].sort((a, b) => a.week_no - b.week_no);
      closed += ws.reduce((a, w) => a + (Number(w.closed_amount) || 0), 0);
      const lastPipe = ws.filter((w) => w.pipeline != null && w.pipeline !== "").pop();
      pipeline += lastPipe ? Number(lastPipe.pipeline) : 0;
      ws.forEach((w) => { if (w.nps != null && w.nps !== "") { npsSum += Number(w.nps); npsN++; } });
    }
    const monthStart = D.parse(S.month), monthEnd = new Date(monthStart.getFullYear(), monthStart.getMonth() + 1, 0);
    const monthExpected = D.elapsedFraction(monthStart, monthEnd);
    const cur = perWeek.find((x) => x.w.no === S.week) || perWeek[0];
    const monthPct = tasks.length ? done / tasks.length : null;
    const openRisks = plans.flatMap((p) => (p.plan_risks || []).filter((r) => !r.resolved));
    return {
      tasks, perWeek, cur, total: tasks.length, done, monthPct, monthExpected,
      visits: visits.length, visitsDone: visits.filter(isDone).length,
      goal, closed, goalPct: goal ? closed / goal : null, pipeline, coverage: goal ? pipeline / goal : null,
      nps: npsN ? npsSum / npsN : null, openRisks,
      weekPace: cur ? pace(cur.pct, cur.expected) : null, monthPace: pace(monthPct, monthExpected),
    };
  }

  // ---------------------------------------------------------------
  //  Componentes visuales
  // ---------------------------------------------------------------
  function ring(pct, size = 64, stroke = 7, color = "var(--green)", track = "var(--line)", label = null, labelColor = "inherit") {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - clamp01(pct));
    const lbl = label ?? pctTxt(pct);
    return `<div class="ring" style="width:${size}px;height:${size}px;color:${labelColor}" role="img" aria-label="${esc(lbl)}">
      <svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
      ${pct ? `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>` : ""}</svg>
      <div class="ring-label" style="font-size:${Math.round(size / (String(lbl).length > 3 ? 4.8 : 4.2))}px">${lbl}</div></div>`;
  }
  const statusPill = (p) => (p ? `<span class="status ${p}">${icon(PACE[p].i)}${PACE[p].l}</span>` : `<span class="status" style="background:var(--surface-2);color:var(--ink-3)">Sin tareas</span>`);
  const bar = (pct, cls = "") => `<div class="bar ${cls}"><i style="width:${Math.round(clamp01(pct) * 100)}%"></i></div>`;
  const avatar = (p, cls = "") => `<div class="avatar r-${p?.role} ${cls}">${esc(initials(p?.full_name))}</div>`;

  function barChart(vals, labels, ref, tips) {
    const W = 340, H = 160, pl = 6, pr = 6, pt = 22, pb = 24;
    const max = Math.max(ref || 0, ...vals.map((v) => v || 0)) * 1.12 || 1;
    const n = vals.length, bw = (W - pl - pr) / n, bwid = Math.min(30, bw * 0.46);
    const y = (v) => H - pb - (v / max) * (H - pt - pb);
    let out = `<line x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}" stroke="var(--line)" stroke-width="1"/>`;
    vals.forEach((v, i) => {
      const x = pl + i * bw + (bw - bwid) / 2, cx = pl + i * bw + bw / 2;
      if (v > 0) {
        const top = y(v), h = H - pb - top, r = Math.min(4, h);
        out += `<path d="M${x},${H - pb} V${top + r} Q${x},${top} ${x + r},${top} H${x + bwid - r} Q${x + bwid},${top} ${x + bwid},${top + r} V${H - pb} Z" fill="var(--green)"/>`;
        out += `<text x="${cx}" y="${top - 6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink-2)">${moneyK(v)}</text>`;
      }
      out += `<text x="${cx}" y="${H - 7}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink-3)">${labels[i]}</text>`;
      out += `<rect x="${pl + i * bw}" y="0" width="${bw}" height="${H}" fill="transparent" data-tip="${esc(tips[i])}"/>`;
    });
    if (ref) {
      const ry = y(ref);
      out += `<line x1="${pl}" x2="${W - pr}" y1="${ry}" y2="${ry}" stroke="var(--olive)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    }
    const legend = ref ? `<div class="row xs muted" style="gap:14px;margin-top:4px"><span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:var(--green);display:inline-block"></i>Cierres</span><span class="row" style="gap:5px"><i style="width:14px;border-top:2px dashed var(--olive);display:inline-block"></i>Meta semanal ${moneyK(ref)}</span></div>` : "";
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cierres por semana">${out}</svg>${legend}`;
  }

  // ---------------------------------------------------------------
  //  Toast / Sheet
  // ---------------------------------------------------------------
  let toastTimer;
  function toast(msg, err = false) {
    let t = $(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
    t.className = "toast" + (err ? " err" : "");
    t.innerHTML = (err ? icon("alert", "sm") : icon("check", "sm")) + `<span>${esc(msg)}</span>`;
    requestAnimationFrame(() => t.classList.add("show"));
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }


  // Confirmación dentro de la página (sin window.confirm)
  function confirmBox(msg, okLabel = "Eliminar") {
    return new Promise((resolve) => {
      const wrap = document.createElement("div");
      wrap.className = "confirm-wrap";
      wrap.innerHTML = `<div class="confirm-box" role="alertdialog" aria-modal="true"><div class="bold">${esc(msg)}</div>
        <div class="form-actions"><button class="btn ghost" data-c="0">Cancelar</button><button class="btn danger" data-c="1">${esc(okLabel)}</button></div></div>`;
      document.body.appendChild(wrap);
      wrap.querySelector('[data-c="1"]').focus();
      wrap.addEventListener("click", (e) => {
        const b = e.target.closest("[data-c]");
        if (!b && e.target !== wrap) return;
        e.stopPropagation(); wrap.remove(); resolve(!!b && b.dataset.c === "1");
      });
    });
  }

  let SHEET = null;
  function openSheet(opts) {
    closeSheet(true);
    const bd = document.createElement("div"); bd.className = "backdrop";
    const sh = document.createElement("div"); sh.className = "sheet" + (opts.wide ? " wide" : "");
    sh.setAttribute("role", "dialog"); sh.setAttribute("aria-modal", "true");
    document.body.append(bd, sh);
    SHEET = { ...opts, el: sh, bd };
    SHEET.refresh = () => {
      const scroll = sh.querySelector(".sheet-body")?.scrollTop || 0;
      sh.innerHTML = `<div class="grab"></div><div class="sheet-head"><h2>${opts.title()}</h2>
        <button class="icon-btn" data-act="close-sheet" aria-label="Cerrar">${icon("x")}</button></div>
        <div class="sheet-body">${opts.body()}</div>${opts.foot ? `<div class="sheet-foot">${opts.foot()}</div>` : ""}`;
      sh.querySelector(".sheet-body").scrollTop = scroll;
      opts.mounted && opts.mounted(sh);
    };
    SHEET.refresh();
    bd.addEventListener("click", () => closeSheet());
    requestAnimationFrame(() => { bd.classList.add("show"); sh.classList.add("show"); });
    document.body.style.overflow = "hidden";
    return SHEET;
  }
  function closeSheet(instant) {
    if (!SHEET) return;
    const { el, bd } = SHEET; SHEET = null;
    document.body.style.overflow = "";
    if (instant) { el.remove(); bd.remove(); return; }
    el.classList.remove("show"); bd.classList.remove("show");
    setTimeout(() => { el.remove(); bd.remove(); }, 260);
  }

  // ---------------------------------------------------------------
  //  Carga de datos
  // ---------------------------------------------------------------
  async function loadProfiles() {
    S.profiles = await API.listProfiles();
    S.by = {}; S.profiles.forEach((p) => (S.by[p.id] = p));
    if (S.by[S.me.id]) S.me = S.by[S.me.id];
  }
  async function loadMonth() {
    const [tasks, plans] = await Promise.all([API.listTasks(S.month), API.listPlans(S.month)]);
    S.tasks = tasks; S.plans = plans;
  }
  async function reloadAll() { await loadProfiles(); await loadMonth(); }

  async function setMonth(delta) {
    S.month = D.addMonths(S.month, delta);
    const isCur = S.month === D.monthKey(today);
    S.week = isCur ? D.weekNoOf(today) : 1;
    S.openWeeks = {};
    renderLoading();
    try { await loadMonth(); } catch (e) { toast(e.message, true); }
    render();
  }

  function parseHash() {
    const [r, p] = location.hash.replace(/^#\/?/, "").split("/");
    S.route = r || "home"; S.param = p || null;
  }
  window.addEventListener("hashchange", () => { parseHash(); render(); window.scrollTo(0, 0); });
  const go = (h) => { if (location.hash === h) render(); else location.hash = h; };

    if (S.route === "team" && !hasTeam()) S.route = "home";

    const view = (views[S.route] || viewHome)();
    const nav = [
      ["home", "home", "Inicio"], ["plan", "map", "Hoja de ruta"],
      ...(hasTeam() ? [["team", "users", "Equipo"]] : []),
      ...(S.me.is_admin ? [["admin", "shield", "Admin"]] : []),
      ["profile", "user", "Perfil"],

        ${nav.map(([r, i, l]) => `<a href="#/${r}" class="${S.route === r ? "active" : ""}"><span class="pill">${icon(i)}<span class="lbl-inline">${l}</span></span><span class="lbl-stack">${l.split(" ")[0] === "Hoja" ? "Plan" : l}</span></a>`).join("")}
        <div class="nav-foot"><div class="row">${avatar(S.me)}<div class="grow"><div class="bold small ellipsis">${esc(S.me.full_name)}</div><div class="xs muted">${ROLE[S.me.role]}${S.me.is_admin ? " · Admin" : ""}</div></div></div>
        ${API.mode === "demo" ? `<div class="chip olive" style="margin-top:10px">Modo demo</div>` : ""}</div>
      </nav>
      <main class="main"><div class="page" id="view">${view}</div></main>
    </div>`;

  const monthSwitch = () => `<div class="month-sw"><button data-act="month" data-d="-1" aria-label="Mes anterior">${icon("chevL", "sm")}</button>

  // ---------------------------------------------------------------
  //  VISTA: Inicio
  // ---------------------------------------------------------------
  function viewHome() {
    const subj = subject(), mine = subj.id === S.me.id;
    const st = stats(subj.id);
    const weeks = st.perWeek;
    const cw = weeks.find((x) => x.w.no === S.week) || weeks[0];
    const wTasks = st.tasks.filter((t) => t.period === "semanal" && t.week_no === cw.w.no);
    const mTasks = st.tasks.filter((t) => t.period === "mensual");
    const sortT = (a, b) => (isDone(a) - isDone(b)) || String(a.created_at).localeCompare(String(b.created_at));
    const isNow = S.month === D.monthKey(today) && cw.w.no === D.weekNoOf(today);
    const hello = mine ? `Hola, ${esc(firstName(S.me.full_name))}` : esc(subj.full_name);
    const canAdd = canManage(subj.id);

    const hero = `<div class="hero">
      <div class="hero-top">
        ${ring(cw.pct, 88, 9, "#fff", "rgba(255,255,255,.22)", cw.total ? pctTxt(cw.pct) : "—", "#fff")}
        <div class="grow">
          <div class="eyebrow">Semana ${cw.w.no}${isNow ? " · actual" : ""}</div>
          <div class="big">${cw.total ? `${cw.done} de ${cw.total} tareas` : "Sin tareas aún"}</div>
          <div class="meta">${D.rangeLabel(cw.w)} · ${cw.total ? (cw.done === cw.total ? "¡Semana completa! 🎉" : `${cw.total - cw.done} pendientes`) : "Planifica tus visitas"}</div>
        </div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat"><div class="v num">${pctTxt(st.monthPct)}</div><div class="l">Avance del mes</div><div class="bar"><i style="width:${Math.round(clamp01(st.monthPct) * 100)}%"></i></div></div>
        <div class="hero-stat"><div class="v num">${st.visitsDone}/${st.visits}</div><div class="l">Visitas</div><div class="bar"><i style="width:${st.visits ? Math.round(st.visitsDone / st.visits * 100) : 0}%"></i></div></div>
        <div class="hero-stat"><div class="v num">${st.goal ? pctTxt(st.goalPct) : "—"}</div><div class="l">Meta ${st.goal ? moneyK(st.goal) : "sin definir"}</div><div class="bar"><i style="width:${Math.round(clamp01(st.goalPct) * 100)}%"></i></div></div>
      </div>
    </div>`;

    const strip = `<div class="weeks" role="tablist" aria-label="Semanas del mes">${weeks.map((x) => {
      const p = pace(x.pct, x.expected);
      const now = S.month === D.monthKey(today) && x.w.no === D.weekNoOf(today);
      return `<button class="wk ${x.w.no === cw.w.no ? "sel" : ""}" data-act="week" data-no="${x.w.no}" role="tab" aria-selected="${x.w.no === cw.w.no}"
        data-tip="Semana ${x.w.no}: ${x.done}/${x.total} tareas (${pctTxt(x.pct)})">
        <span class="wk-n">S${x.w.no}</span>
        <span class="col"><i style="height:${Math.round(clamp01(x.pct) * 100)}%;background:${p ? PACE_COLOR[p] : "transparent"}"></i></span>
        <span class="wk-p num">${x.total ? pctTxt(x.pct) : "—"}</span>
        <span class="wk-d">${D.rangeLabel(x.w)}</span>${now ? `<span class="now">hoy</span>` : ""}</button>`;
    }).join("")}</div>`;

    const list = (arr, emptyTxt, period) => arr.length
      ? arr.sort(sortT).map(taskItem).join("")
      : `<div class="empty"><div class="e-ico">${icon(period === "mensual" ? "calendar" : "pin")}</div><div class="bold" style="color:var(--ink-2)">${emptyTxt}</div>
         ${canAdd ? `<button class="btn soft sm" style="margin-top:12px" data-act="new-task" data-period="${period}">${icon("plus", "sm")}Agregar tarea</button>` : ""}</div>`;

    const plan = planOf(subj.id);
    const side = `<div class="card">
        <div class="row between"><h3 style="margin:0">Hoja de ruta del mes</h3><a class="btn sm ghost" href="#/plan${mine ? "" : "/" + subj.id}">Abrir ${icon("chevR", "sm")}</a></div>

          <div><div class="xs muted bold">Cobertura pipeline</div><div class="bold num" style="font-size:18px">${st.coverage != null ? st.coverage.toFixed(1) + "x" : "—"}</div><div class="xs muted">objetivo &gt; 3x la meta</div>${bar(st.coverage != null ? st.coverage / 3 : 0, st.coverage != null && st.coverage < 3 ? "olive" : "")}</div>
        </div>

        ${st.openRisks.length ? `<div class="row" style="margin-top:12px;color:var(--brick)" >${icon("alert", "sm")}<span class="small bold">${st.openRisks.length} riesgo${st.openRisks.length > 1 ? "s" : ""} abierto${st.openRisks.length > 1 ? "s" : ""}</span></div>` : ""}

          ${list(wTasks, "No hay tareas para esta semana", "semanal")}
          <div class="section-title"><span>Tareas del mes</span><span class="count">${mTasks.filter(isDone).length}/${mTasks.length}</span></div>
          ${list(mTasks, "No hay tareas mensuales", "mensual")}
        </div>
        <div><div class="section-title" style="margin-top:0"><span>Resumen</span></div>${side}</div>
      </div>
      ${canAdd ? `<button class="fab" data-act="new-task" aria-label="Nueva tarea">${icon("plus")}</button>` : ""}`;
  }

  function teamTeaser() {
    const subs = subordinates();
    const sellers = subs.filter((p) => p.role === "vendedor");
    const st = stats(subs.map((p) => p.id));
    const behind = subs.filter((p) => stats(p.id).weekPace === "bad");
    return `<div class="card" style="cursor:pointer" data-act="goto" data-to="#/team">
      <div class="row">${ring(st.cur?.pct, 56, 6, "var(--green)", "var(--line)")}
      <div class="grow"><h3 style="margin:0">Mi equipo esta semana</h3>
      <div class="small muted">${subs.length} persona${subs.length !== 1 ? "s" : ""} · ${sellers.length} vendedor${sellers.length !== 1 ? "es" : ""}</div>
      ${behind.length ? `<div class="small bold" style="color:var(--brick);margin-top:4px">${behind.length} con avance rezagado</div>` : `<div class="small bold" style="color:var(--green);margin-top:4px">Todos al día</div>`}</div>${icon("chevR")}</div></div>`;
  }

  function taskItem(t) {
    const done = isDone(t), prog = t.status === "en_progreso";
    const canEdit = canManage(t.owner_id);
    const ty = TYPES[t.task_type] || TYPES.otro;
    const ck = t.task_type === "visita" ? checklistPct(t.checklist) : null;
    const by = t.created_by && t.created_by !== t.owner_id ? S.by[t.created_by] : null;
    const chips = [];
    if (t.client) chips.push(`<span class="chip">${ty.l}</span>`);
    if (prog) chips.push(`<span class="chip olive">En progreso</span>`);
    if (ck != null) chips.push(`<span class="chip ${ck >= 1 ? "green" : ""}">${icon("clip", "sm")}Checklist <span class="mini-bar ${ck >= 1 ? "full" : ""}"><i style="width:${Math.round(ck * 100)}%"></i></span>${pctTxt(ck)}</span>`);
    if (by) chips.push(`<span class="chip slate">Asignada por ${esc(firstName(by.full_name))}</span>`);
    if (t.due_date) chips.push(`<span class="chip">${icon("calendar", "sm")}${D.shortDate(t.due_date)}</span>`);
    return `<div class="task ${done ? "done" : ""}">
      <button class="check ${done ? "on" : prog ? "half" : ""}" data-act="toggle" data-id="${t.id}" aria-label="${done ? "Marcar pendiente" : "Marcar completada"}" ${canEdit ? "" : "disabled"}>${icon(prog && !done ? "minus" : "check", "sm")}</button>
      <div class="t-body" data-act="edit-task" data-id="${t.id}">
        <div class="t-client">${icon(ty.i, "sm")}${esc(t.client || ty.l)}</div>
        <div class="t-title">${esc(t.title)}</div>
        ${chips.length ? `<div class="t-meta">${chips.join("")}</div>` : ""}
      </div></div>`;
  }

  // ---------------------------------------------------------------
  //  VISTA: Hoja de ruta mensual (Plantilla 2)
  // ---------------------------------------------------------------
  function viewPlan() {
    const subj = subject(), mine = subj.id === S.me.id, editable = canManage(subj.id);
    const plan = planOf(subj.id);
    const st = stats(subj.id);
    const weeks = st.perWeek;
    const wk = (no) => (plan?.plan_weeks || []).find((w) => w.week_no === no) || {};
    const dis = editable ? "" : "readonly";

    const info = `<div class="card">
      <h3>${icon("target", "sm")} Información del mes</h3>
      <div class="grid g2">
        <label class="field"><span>Meta de cierres del mes</span><div class="money"><input class="input num" inputmode="decimal" data-plan-field="goal_amount" value="${plan?.goal_amount ? Number(plan.goal_amount) : ""}" placeholder="0" ${dis}></div></label>
        <label class="field" style="margin-top:0"><span>Territorio</span><input class="input" data-plan-field="territory" value="${esc(plan?.territory ?? subj.territory ?? "")}" placeholder="Ej. GAM Oeste" ${dis}></label>
      </div>
      <div class="xs muted" style="margin-top:8px">${mine ? "Gerente" : "Responsable"}: <b>${esc(mine ? (S.by[subj.manager_id]?.full_name || "—") : subj.full_name)}</b></div>
    </div>`;

    const kpis = `<div id="plan-kpis">${planKpis(st)}</div>`;

      const visitsDone = ts.filter((t) => t.task_type === "visita" && isDone(t)).length;
      return `<details class="week-acc" data-week-acc="${x.w.no}" ${open ? "open" : ""}>
        <summary><div class="wk-badge ${isNow ? "cur" : ""}">S${x.w.no}</div>
          <div class="grow"><div class="bold">Semana ${x.w.no} <span class="muted small" style="font-weight:600">· ${D.rangeLabel(x.w)}</span></div>
          <div class="row" style="gap:8px;margin-top:3px">${x.total ? statusPill(p) : ""}<span class="xs muted">${x.done}/${x.total} tareas · ${visitsDone} visitas</span></div></div>
          ${ring(x.pct, 44, 5, p ? PACE_COLOR[p] : "var(--green)")}<span class="chev">${icon("chevR")}</span></summary>
        <div class="wa-body">
          <div class="grid g2" style="margin-top:14px">
            <label class="field"><span>Ubicación principal</span><input class="input" data-week-field="main_location" data-week="${x.w.no}" value="${esc(w.main_location || "")}" placeholder="Zona / ciudad" ${dis}></label>
            <label class="field" style="margin-top:0"><span>Acción corporativa</span><input class="input" data-week-field="corporate_action" data-week="${x.w.no}" value="${esc(w.corporate_action || "")}" placeholder="Ej. Capacitación en Datacom" ${dis}></label>
          </div>
          <div class="section-title" style="margin-top:18px"><span>Clientes y objetivos</span>${editable ? `<button class="btn sm soft" data-act="new-task" data-period="semanal" data-week="${x.w.no}">${icon("plus", "sm")}Agregar</button>` : ""}</div>
          ${ts.length ? `<div>${ts.map((t, i) => `<div class="tbl-row">
              <button class="check ${isDone(t) ? "on" : t.status === "en_progreso" ? "half" : ""}" data-act="toggle" data-id="${t.id}" aria-label="Completar" ${editable ? "" : "disabled"}>${icon(t.status === "en_progreso" ? "minus" : "check", "sm")}</button>
              <div class="grow" data-act="edit-task" data-id="${t.id}" style="cursor:pointer"><div class="bold small ellipsis">${i + 1}. ${esc(t.client || TYPES[t.task_type]?.l)}</div><div class="small muted ellipsis">${esc(t.title)}</div></div>
              ${t.task_type === "visita" ? `<span class="chip ${checklistPct(t.checklist) >= 1 ? "green" : ""}">${pctTxt(checklistPct(t.checklist))}</span>` : `<span class="chip">${TYPES[t.task_type]?.l}</span>`}
            </div>`).join("")}</div>` : `<div class="small muted" style="padding:6px 2px">Sin clientes planificados.</div>`}
          <div class="section-title" style="margin-top:18px"><span>Indicadores de la semana</span></div>
          <div class="ind-grid">
            <label class="field"><span>Pipeline</span><div class="money"><input class="input num" inputmode="decimal" data-week-field="pipeline" data-week="${x.w.no}" value="${w.pipeline ?? ""}" ${dis}></div></label>
            <label class="field"><span>Cierres semana</span><div class="money"><input class="input num" inputmode="decimal" data-week-field="closed_amount" data-week="${x.w.no}" value="${w.closed_amount ?? ""}" ${dis}></div></label>
            <label class="field"><span>Cierre YTD</span><div class="money"><input class="input num" inputmode="decimal" data-week-field="closed_ytd" data-week="${x.w.no}" value="${w.closed_ytd ?? ""}" ${dis}></div></label>
            <label class="field"><span>NPS medido</span><input class="input num" inputmode="decimal" data-week-field="nps" data-week="${x.w.no}" value="${w.nps ?? ""}" ${dis}></label>
          </div>
          <div class="xs muted" style="margin-top:8px"># Visitas se calcula solo: ${visitsDone} visita${visitsDone !== 1 ? "s" : ""} completada${visitsDone !== 1 ? "s" : ""}.</div>
        </div></details>`;
    }).join("");

    const risks = (plan?.plan_risks || []).slice().sort((a, b) => (a.resolved - b.resolved) || ("abm".indexOf(a.impact[0]) - "abm".indexOf(b.impact[0])));
    const risksHtml = risks.length ? risks.map((r) => `<div class="risk ${r.resolved ? "resolved" : ""}" data-act="edit-risk" data-id="${r.id}" style="cursor:pointer">
        <div class="r-bar" style="background:var(--${IMPACT[r.impact].c})"></div>
        <div class="grow"><div class="row between"><div class="bold">${esc(r.description)}</div><span class="chip ${IMPACT[r.impact].c}">${IMPACT[r.impact].l}</span></div>
        ${r.mitigation ? `<div class="small muted" style="margin-top:4px">${icon("shield", "sm")} ${esc(r.mitigation)}</div>` : ""}
        <div class="row" style="margin-top:6px;gap:6px">${r.due_date ? `<span class="chip">${icon("calendar", "sm")}${D.shortDate(r.due_date)}</span>` : ""}${r.resolved ? `<span class="chip green">${icon("check", "sm")}Resuelto</span>` : ""}</div></div></div>`).join("")
      : `<div class="empty"><div class="e-ico">${icon("shield")}</div><div class="bold" style="color:var(--ink-2)">Sin riesgos registrados</div><div class="small">Identifica riesgos logísticos, de competencia, etc.</div></div>`;

    return `<header class="topbar"><div class="grow"><h1>Hoja de ruta</h1><div class="sub">${mine ? "Planificación y seguimiento mensual" : esc(subj.full_name)}</div></div>${monthSwitch()}</header>
      ${viewingBanner(subj, "plan")}
      <div class="cols">
        <div>${info}${kpis}
          <div class="section-title"><span>Semanas</span><span class="count">${weeks.length}</span></div>${weeksHtml}</div>
        <div>
          <div class="section-title" style="margin-top:0"><span>Cierres por semana</span></div>${chart}
          <div class="section-title"><span>Puntos de alerta / riesgos</span>${editable ? `<button class="btn sm soft" data-act="new-risk">${icon("plus", "sm")}Riesgo</button>` : ""}</div>${risksHtml}
        </div>
      </div>`;
  }

  function planKpis(st) {
    const cov = st.coverage;
    return `<div class="grid g2m" style="margin-top:12px">
      <div class="kpi"><div class="k-l">${icon("target", "sm")}Meta</div><div class="k-v num">${pctTxt(st.goalPct)}</div><div class="k-s num">${money(st.closed)} de ${money(st.goal)}</div>${bar(st.goalPct)}</div>
      <div class="kpi"><div class="k-l">${icon("trend", "sm")}Pipeline</div><div class="k-v num">${cov != null ? cov.toFixed(1) + "x" : "—"}</div><div class="k-s num">${money(st.pipeline)} · objetivo 3x</div>${bar(cov != null ? cov / 3 : 0, cov != null && cov < 3 ? "olive" : "")}</div>
      <div class="kpi"><div class="k-l">${icon("pin", "sm")}Visitas</div><div class="k-v num">${st.visitsDone}<span class="muted" style="font-size:15px">/${st.visits}</span></div><div class="k-s">completadas / planificadas</div>${bar(st.visits ? st.visitsDone / st.visits : 0)}</div>
      <div class="kpi"><div class="k-l">${icon("smile", "sm")}NPS promedio</div><div class="k-v num">${st.nps != null ? Math.round(st.nps) : "—"}</div><div class="k-s">de las semanas medidas</div>${bar(st.nps != null ? (st.nps + 100) / 200 : 0)}</div>
    </div>`;
  }
  function planChart(st, plan) {
    const weeks = st.perWeek;
    const vals = weeks.map((x) => Number((plan?.plan_weeks || []).find((w) => w.week_no === x.w.no)?.closed_amount) || 0);
    const ref = st.goal ? st.goal / weeks.length : 0;
    const tips = weeks.map((x, i) => `Semana ${x.w.no} (${D.rangeLabel(x.w)}): ${money(vals[i])}`);
    return barChart(vals, weeks.map((x) => "S" + x.w.no), ref, tips) +
      `<div class="row between xs muted" style="margin-top:6px"><span>Total del mes: <b class="num" style="color:var(--ink)">${money(st.closed)}</b></span><span>Meta: <b class="num" style="color:var(--ink)">${money(st.goal)}</b></span></div>`;
  }
  function refreshPlanParts() {
    const subj = subject(); const st = stats(subj.id);
    const k = $("#plan-kpis"); if (k) k.innerHTML = planKpis(st);
    const c = $("#plan-chart"); if (c) c.innerHTML = planChart(st, planOf(subj.id));
  }

  async function ensurePlanFor(ownerId) {
    let p = planOf(ownerId);
    if (p) return p;
    p = await API.ensurePlan(ownerId, S.month);
    S.plans.push(p);
    return p;
  }

  async function onPlanField(el) {
    const subj = subject();
    const num = (v) => (v === "" ? null : Number(String(v).replace(/[^0-9.\-]/g, "")));
    try {
      const plan = await ensurePlanFor(subj.id);
      if (el.dataset.planField) {
        const f = el.dataset.planField;
        const val = f === "goal_amount" ? num(el.value) ?? 0 : el.value.trim();
        const row = await API.updatePlan(plan.id, { [f]: val });
        Object.assign(plan, row);
      } else {
        const f = el.dataset.weekField, no = Number(el.dataset.week);
        const val = ["pipeline", "closed_amount", "closed_ytd", "nps"].includes(f) ? num(el.value) : el.value.trim();
        const row = await API.upsertWeek(plan.id, no, { [f]: val });
        plan.plan_weeks = plan.plan_weeks || [];
        const i = plan.plan_weeks.findIndex((w) => w.week_no === no);
        if (i >= 0) plan.plan_weeks[i] = { ...plan.plan_weeks[i], ...row }; else plan.plan_weeks.push(row);
      }
      refreshPlanParts();
      toast("Guardado");
    } catch (e) { toast(e.message, true); }
  }

  function viewTeam() {
    const subs = subordinates();
    const ids = subs.map((p) => p.id);
    const st = stats(ids);
    const byPace = { ok: 0, warn: 0, bad: 0 };
    const sellers = subs.filter((p) => p.role === "vendedor");
    sellers.forEach((p) => { const s = stats(p.id).weekPace; if (s) byPace[s]++; });

    const kpis = `<div class="grid g2m g4">
      <div class="kpi"><div class="k-l">${icon("calendar", "sm")}Semana ${S.week}</div><div class="k-v num">${pctTxt(st.cur?.pct)}</div><div class="k-s">${st.cur?.done || 0}/${st.cur?.total || 0} tareas</div>${bar(st.cur?.pct)}</div>
      <div class="kpi"><div class="k-l">${icon("map", "sm")}Mes</div><div class="k-v num">${pctTxt(st.monthPct)}</div><div class="k-s">${st.done}/${st.total} tareas</div>${bar(st.monthPct)}</div>
      <div class="kpi"><div class="k-l">${icon("target", "sm")}Meta del equipo</div><div class="k-v num">${pctTxt(st.goalPct)}</div><div class="k-s num">${moneyK(st.closed)} de ${moneyK(st.goal)}</div>${bar(st.goalPct)}</div>
      <div class="kpi"><div class="k-l">${icon("users", "sm")}Vendedores</div><div class="k-v num">${sellers.length}</div>
        <div class="row wrap" style="gap:4px;margin-top:4px"><span class="status ok">${icon("check")}${byPace.ok} al día</span><span class="status warn">${icon("minus")}${byPace.warn} atención</span><span class="status bad">${icon("alert")}${byPace.bad} rezagado${byPace.bad === 1 ? "" : "s"}</span></div></div>
    </div>`;

    const set = new Set(ids);
    const roots = subs.filter((p) => !p.manager_id || !set.has(p.manager_id));
    const node = (p, depth) => {
      const kids = children(p.id, subs);
      if (!kids.length) return personCard(p);
      return `<div class="group"><div class="group-head">${personCard(p, true)}</div>
        <div class="group-children"><div class="grid ${depth === 0 && kids.some((k) => children(k.id, subs).length) ? "" : "g2"}">${kids.map((k) => node(k, depth + 1)).join("")}</div></div></div>`;
    };
    const leafRoots = roots.filter((p) => !children(p.id, subs).length);
    const groupRoots = roots.filter((p) => children(p.id, subs).length);
    const org = groupRoots.map((p) => node(p, 0)).join("") + (leafRoots.length ? `<div class="grid g2" style="margin-top:18px">${leafRoots.map((p) => personCard(p)).join("")}</div>` : "");

    const ranking = sellers.map((p) => ({ p, s: stats(p.id) })).sort((a, b) => (b.s.monthPct ?? -1) - (a.s.monthPct ?? -1));
    const rank = `<div class="list-card">${ranking.map(({ p, s }, i) => `<div class="user-row" data-act="open-person" data-id="${p.id}">
        <div class="bold num muted" style="width:22px">${i + 1}</div>${avatar(p)}
        <div class="grow"><div class="row between"><span class="bold ellipsis">${esc(p.full_name)}</span><span class="bold num">${pctTxt(s.monthPct)}</span></div>
        ${bar(s.monthPct, s.monthPace === "bad" ? "brick" : s.monthPace === "warn" ? "olive" : "")}
        <div class="row between xs muted" style="margin-top:4px"><span>${esc(S.by[p.manager_id]?.full_name || "")}</span><span>Meta ${pctTxt(s.goalPct)}</span></div></div></div>`).join("") || `<div class="empty">Sin vendedores</div>`}</div>`;

    return `<header class="topbar"><div class="grow"><h1>Mi equipo</h1><div class="sub">${subs.length} personas bajo tu cargo</div></div>${monthSwitch()}</header>
      ${kpis}
      <div class="row between" style="margin:20px 0 4px"><div class="seg sm" style="width:240px;max-width:100%">
        <button class="${S.teamMode === "org" ? "on" : ""}" data-act="team-mode" data-m="org">Organización</button>
        <button class="${S.teamMode === "rank" ? "on" : ""}" data-act="team-mode" data-m="rank">Ranking</button></div>
        <span class="xs muted">Anillo = avance semana ${S.week}</span></div>
      ${S.teamMode === "org" ? org : `<div style="margin-top:12px">${rank}</div>`}`;
  }

  function personCard(p, isLead = false) {
    const team = isLead ? [p.id, ...descendants(p.id).map((x) => x.id)] : [p.id];
    const s = stats(team);
    const n = team.length - 1;
    return `<div class="person" data-act="open-person" data-id="${p.id}" style="${isLead ? "flex:1" : ""}">
      ${avatar(p)}
      <div class="grow" style="min-width:0">
        <div class="p-name ellipsis">${esc(p.full_name)}</div>
        <div class="p-role ellipsis">${ROLE[p.role]}${p.territory ? " · " + esc(p.territory) : ""}${isLead ? ` · equipo de ${n}` : ""}</div>
        <div class="p-stats">${statusPill(s.weekPace)}<span class="xs muted num">Mes ${pctTxt(s.monthPct)} · Meta ${pctTxt(s.goalPct)}</span></div>
      </div>
      ${ring(s.cur?.pct, 50, 6, s.weekPace ? PACE_COLOR[s.weekPace] : "var(--green)")}
    </div>`;
  }

  // ---------------------------------------------------------------
  function viewAdmin() {
    const all = S.profiles.slice().sort((a, b) => RANK[b.role] - RANK[a.role] || a.full_name.localeCompare(b.full_name));
    const q = S.adminQ.toLowerCase();
    const f = S.adminFilter;
    const list = all.filter((p) => (f === "all" ? p.active : f === "inactive" ? !p.active : p.role === f && p.active)
      && (!q || p.full_name.toLowerCase().includes(q) || p.email.includes(q)));
    const counts = { all: all.filter((p) => p.active).length, inactive: all.filter((p) => !p.active).length };
    Object.keys(ROLE).forEach((r) => (counts[r] = all.filter((p) => p.role === r && p.active).length));

    const users = `<div class="search" style="margin-top:14px">${icon("search")}<input class="input" id="admin-q" placeholder="Buscar por nombre o correo" value="${esc(S.adminQ)}"></div>
      <div class="chips" style="margin:12px 0">${[["all", "Todos"], ["director_general", "Dir. general"], ["director", "Directores"], ["gerente", "Gerentes"], ["vendedor", "Vendedores"], ["inactive", "Inactivos"]]
        .map(([k, l]) => `<button class="chip-btn ${f === k ? "on" : ""}" data-act="admin-filter" data-f="${k}">${l} <span class="muted">${counts[k]}</span></button>`).join("")}</div>
      <div class="list-card">${list.map((p) => `<div class="user-row" data-act="edit-user" data-id="${p.id}">
        ${avatar(p)}<div class="grow" style="min-width:0"><div class="row" style="gap:6px"><span class="bold ellipsis">${esc(p.full_name)}</span>${p.is_admin ? `<span class="chip green">${icon("shield", "sm")}Admin</span>` : ""}${!p.active ? `<span class="chip brick">Inactivo</span>` : ""}</div>
        <div class="xs muted ellipsis">${esc(p.email)}</div>
        <div class="xs muted ellipsis">${ROLE[p.role]}${p.manager_id ? " · reporta a " + esc(S.by[p.manager_id]?.full_name || "—") : ""}</div></div>${icon("chevR", "sm")}</div>`).join("") || `<div class="empty" style="border:0">Sin resultados</div>`}</div>`;

    const roots = all.filter((p) => !p.manager_id || !S.by[p.manager_id]);
    const tree = (p) => {
      const kids = all.filter((x) => x.manager_id === p.id);
      return `<li><span class="node" data-act="edit-user" data-id="${p.id}">${avatar(p)}<span><span class="bold small">${esc(p.full_name)}</span>${!p.active ? ' <span class="chip brick">Inactivo</span>' : ""}<br><span class="xs muted">${ROLE[p.role]}${p.territory ? " · " + esc(p.territory) : ""}</span></span></span>
        ${kids.length ? `<ul>${kids.map(tree).join("")}</ul>` : ""}</li>`;
    };
    const org = `<div class="card tree" style="margin-top:14px;overflow-x:auto"><ul>${roots.map(tree).join("")}</ul></div>`;

    return `<header class="topbar"><div class="grow"><h1>Administración</h1><div class="sub">Usuarios, roles y contraseñas</div></div>
      <button class="btn" data-act="new-user">${icon("plus", "sm")}<span>Usuario</span></button></header>
      <div class="seg" style="max-width:360px"><button class="${S.adminTab === "users" ? "on" : ""}" data-act="admin-tab" data-t="users">${icon("users", "sm")} Usuarios</button>
        <button class="${S.adminTab === "org" ? "on" : ""}" data-act="admin-tab" data-t="org">${icon("tree", "sm")} Organigrama</button></div>
      ${S.adminTab === "users" ? users : org}`;
  }

  const tempPassword = () => {
    const words = ["Ruta", "Meta", "Visita", "Cliente", "Plan", "Norte", "Pacifico", "Volcan"];
    const w = words[Math.floor(Math.random() * words.length)];
    const n = Math.floor(1000 + Math.random() * 9000);
    const a = "abcdefghjkmnpqrstuvwxyz"; const s = a[Math.floor(Math.random() * a.length)] + a[Math.floor(Math.random() * a.length)];
    return `${w}-${n}-${s}`;
  };

  function managerOptions(role, selfId) {
    return S.profiles.filter((p) => p.active && p.id !== selfId && RANK[p.role] > RANK[role] && !(selfId && isUnder(p.id, selfId)))
      .sort((a, b) => RANK[b.role] - RANK[a.role] || a.full_name.localeCompare(b.full_name));
  }

    const isNew = !p;
    const m = isNew ? { full_name: "", email: "", role: "vendedor", manager_id: "", territory: "", password: tempPassword(), is_admin: false, active: true }
      : { ...p, manager_id: p.manager_id || "" };

    openSheet({
      title: () => (isNew ? "Nuevo usuario" : "Editar usuario"),

        return `

          <div class="xs muted" style="margin-top:6px">Se le pedirá cambiarla en su primer ingreso.</div></label>`

          <label class="switch"><span><span class="bold small">Administrador</span><br><span class="xs muted">Acceso a este centro de administración</span></span><input type="checkbox" data-bind="is_admin" ${m.is_admin ? "checked" : ""}></label>

        ${err ? `<div class="error-msg">${esc(err)}</div>` : ""}`;
      },
      foot: () => `<button class="btn ghost" data-act="close-sheet">Cancelar</button><button class="btn" data-act="save">${isNew ? "Crear usuario" : "Guardar"}</button>`,
      model: m,
      actions: {
        set: (el) => { m[el.dataset.k] = el.dataset.v; SHEET.refresh(); },
        regen: () => { m.password = tempPassword(); SHEET.refresh(); },
        "reset-pass": () => openResetSheet(p),
        "delete-user": async () => {
          if (!(await confirmBox(`¿Eliminar a ${p.full_name}? Sus tareas y planes se borrarán y sus subordinados pasarán a su jefe.`))) return;
          try { await API.admin("delete", { user_id: p.id }); closeSheet(); await reloadAll(); render(); toast("Usuario eliminado"); } catch (e) { toast(e.message, true); }
        },
        save: async (el) => {
          err = "";
          if (!m.full_name.trim()) { err = "Escribe el nombre"; return SHEET.refresh(); }
          el.disabled = true;
          try {
            if (isNew) {
              const r = await API.admin("create", { email: m.email, password: m.password, full_name: m.full_name.trim(), role: m.role, manager_id: m.manager_id || null, territory: m.territory || null });
              await reloadAll(); closeSheet(); render();
              openCredentialsSheet(m.full_name, m.email, m.password, r);
            } else {
              await API.updateProfile(p.id, { full_name: m.full_name.trim(), role: m.role, manager_id: m.manager_id || null, territory: m.territory || null, is_admin: !!m.is_admin });
              if (m.active !== p.active) await API.admin("set_active", { user_id: p.id, active: !!m.active });
              await reloadAll(); closeSheet(); render(); toast("Usuario actualizado");
            }
          } catch (e) { err = e.message; el.disabled = false; SHEET.refresh(); }
        },
      },
    });
  }

        : `<button class="btn ghost" data-act="regen">${icon("refresh", "sm")}Otra</button><button class="btn" data-act="confirm">Restablecer</button>`,
